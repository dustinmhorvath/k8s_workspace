---
apiVersion: v1
kind: Service
metadata:
  name: simplex-web
spec:
  selector:
    app: simplex-smp
  ports:
    - name: simplex-web
      port: 443
      protocol: TCP
      targetPort: 443
---
apiVersion: v1
kind: Service
metadata:
  name: simplex-xftp
  annotations:
    metallb.universe.tf/allow-shared-ip: "shared-192.168.1.214"
spec:
  selector:
    app: simplex-xftp
  ports:
    - name: simplex-xftp
      port: 443
      protocol: TCP
      targetPort: 443
  loadBalancerIP: 192.168.1.214
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: simplex-smp
  annotations:
    metallb.universe.tf/allow-shared-ip: "shared-192.168.1.214"
spec:
  selector:
    app: simplex-smp
  ports:
    - name: simplex-smp
      port: 5223
      protocol: TCP
      targetPort: 5223
  loadBalancerIP: 192.168.1.214
  type: LoadBalancer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: simplex-configs-pvc
  namespace: default
spec:
  storageClassName: csi-rbd-sc
  accessModes:
   - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  #volumeName: simplex-configs-pv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: simplex-state-pvc
  namespace: default
spec:
  storageClassName: csi-rbd-sc
  accessModes:
   - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  #volumeName: simplex-state-pv
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: simplex-smp
spec:
  selector:
    matchLabels:
      app: simplex-smp
  serviceName: "simplex-smp"
  replicas: 1
  template:
    metadata:
      labels:
        app: simplex-smp # has to match .spec.selector.matchLabels
    spec:
      nodeSelector:
        restriction_class: gameserver
    
      tolerations:
      - key: "restriction_class"
        operator: "Equal"
        value: "gameserver"
        effect: "NoSchedule"

      terminationGracePeriodSeconds: 30
      containers:
      - name: simplex-smp
        image: simplexchat/smp-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5223
          protocol: TCP
        - containerPort: 443
          protocol: TCP
        env:
        - name: ADDR
          value: "smp.perihelion.host"
        - name: cert_path
          value: "certificates"

        volumeMounts:
        - name: simplex-configs
          mountPath: /etc/opt/simplex
        - name: simplex-state
          mountPath: /var/opt/simplex
        - name: simplex-certs
          mountPath: "/certificates"
          readOnly: true

      volumes:
      - name: simplex-configs
        persistentVolumeClaim:
          claimName: simplex-configs-pvc
      - name: simplex-state
        persistentVolumeClaim:
          claimName: simplex-state-pvc
      - name: simplex-certs
        secret:
          secretName: simplex-san-certificate
          items:
            - key: tls.key
              path: smp.perihelion.host.key
            - key: tls.crt
              path: smp.perihelion.host.crt
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: simplex-xftp
spec:
  selector:
    matchLabels:
      app: simplex-xftp
  serviceName: "simplex-xftp"
  replicas: 1
  template:
    metadata:
      labels:
        app: simplex-xftp # has to match .spec.selector.matchLabels
    spec:
      nodeSelector:
        restriction_class: gameserver
    
      tolerations:
      - key: "restriction_class"
        operator: "Equal"
        value: "gameserver"
        effect: "NoSchedule"

      terminationGracePeriodSeconds: 30
      containers:
      - name: simplex-xftp
        image: simplexchat/xftp-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 443
          protocol: TCP
        env:
        - name: ADDR
          value: "xftp.perihelion.host"
        - name: QUOTA
          value: "10gb"
        - name: cert_path
          value: "certificates"

        volumeMounts:
        - name: simplex-xftp-configs
          mountPath: /etc/opt/simplex-xftp
        - name: simplex-xftp-logs
          mountPath: /var/opt/simplex-xftp
        - name: simplex-xftp-files
          mountPath: /srv/xftp
        - name: simplex-certs
          mountPath: "/certificates"
          readOnly: true

      volumes:
      - name: simplex-certs
        secret:
          secretName: simplex-san-certificate
          items:
            - key: tls.key
              path: xftp.perihelion.host.key
            - key: tls.crt
              path: xftp.perihelion.host.crt
  volumeClaimTemplates:
    - metadata:
        name: simplex-xftp-configs
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: csi-rbd-sc
        resources:
          requests:
            storage: 5Gi
    - metadata:
        name: simplex-xftp-logs
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: csi-rbd-sc
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: simplex-xftp-files
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: csi-rbd-sc
        resources:
          requests:
            storage: 10Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simplex-web
  labels:
    app: simplex-smp
    gethomepage.dev/enabled: "true"
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

spec:
  rules:
  - host: simplex.perihelion.host
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: simplex-web
            port:
              number: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simplex-smp
  labels:
    app: simplex-smp
    gethomepage.dev/enabled: "true"
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"

spec:
  rules:
  - host: smp.perihelion.host
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: simplex-smp
            port:
              number: 5223
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simplex-xftp
  labels:
    app: simplex-xftp
    gethomepage.dev/enabled: "true"
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"

spec:
  rules:
  - host: xftp.perihelion.host
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: simplex-xftp
            port:
              number: 443
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: simplex-perihelion-host
  namespace: default
spec:
  secretName: simplex-san-certificate

  privateKey:
    algorithm: RSA
    size: 4096

  duration: 2160h # 90 days
  renewBefore: 360h # 15 days

  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    #group: cert-manager.io

  dnsNames:
  - simplex.perihelion.host
  - smp.perihelion.host
  - xftp.perihelion.host
