apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/metallb/metallb-operator.git
    targetRevision: v0.14.2
    path: bin
  destination:
    server: "https://kubernetes.default.svc"
    namespace: metallb-system
