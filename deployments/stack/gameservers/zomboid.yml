---
apiVersion: v1
kind: Service
metadata:
  name: zomboid-udp
  annotations:
    metallb.universe.tf/allow-shared-ip: "shared-192.168.1.215"
spec:
  #externalTrafficPolicy: Local
  #internalTrafficPolicy: Local
  #allocateLoadBalancerNodePorts: true
  selector:
    app: zomboid
  ports:
    - name: zomboid-8766u
      port: 8766
      protocol: UDP
      targetPort: zomboid-8766u
    - name: zomboid-8767u
      port: 8767
      protocol: UDP
      targetPort: zomboid-8767u
    - name: zomboid-16261u
      port: 16261
      protocol: UDP
      targetPort: zomboid-16261u
    - port: 16262
      name: zomboid-16262u
      protocol: UDP
      targetPort: zomboid-16262u
  loadBalancerIP: 192.168.1.215
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: zomboid-tcp
  labels:
    app: zomboid
  annotations:
    metallb.universe.tf/allow-shared-ip: "shared-192.168.1.215"
spec:
  #externalTrafficPolicy: Local
  #internalTrafficPolicy: Local
  #allocateLoadBalancerNodePorts: true
  selector:
    app: zomboid
  ports:
    - name: zomboid-8766t
      port: 8766
      protocol: TCP
      targetPort: zomboid-8766t
    - name: zomboid-8767t
      port: 8767
      protocol: TCP
      targetPort: zomboid-8767t
    - name: zomboid-16261t
      port: 16261
      protocol: TCP
      targetPort: zomboid-16261t
    - name: zomboid-16262t
      port: 16262
      protocol: TCP
      targetPort: zomboid-16262t
    - name: zomboid-27015t
      port: 27015
      protocol: TCP
      targetPort: zomboid-27015t
  loadBalancerIP: 192.168.1.215
  type: LoadBalancer
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zomboid
spec:
  selector:
    matchLabels:
      app: zomboid # has to match .spec.template.metadata.labels
  serviceName: "zomboid"
  replicas: 1
  template:
    metadata:
      labels:
        app: zomboid # has to match .spec.selector.matchLabels
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 30
      containers:
      - name: zomboid
        image: indifferentbroccoli/projectzomboid-server-docker:dev
        imagePullPolicy: Always
        ports:
          - name: zomboid-8766u
            containerPort: 8766
            protocol: UDP
          - name: zomboid-8767u
            containerPort: 8767
            protocol: UDP
          - name: zomboid-16261u
            containerPort: 16261
            protocol: UDP
          - name: zomboid-16261t
            containerPort: 16261
            protocol: TCP
          - name: zomboid-16262u
            containerPort: 16262
            protocol: UDP
          - name: zomboid-16262t
            containerPort: 16262
            protocol: TCP
          - name: zomboid-27015t
            containerPort: 27015
            protocol: TCP
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: SERVER_NAME
          value: "ILG"
        - name: RCON_PASSWORD
          valueFrom:
            secretKeyRef:
              name: zomboid-server-password
              key: server-password
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: zomboid-server-password
              key: server-password
        - name: STEAM_VAC
          value: "false"
        - name: USE_STEAM
          value: "false"
        - name: MEMORY_XMX_GB
          value: "16"
        volumeMounts:
        - name: zomboid-config
          mountPath: /project-zomboid-config
          subPath: config
        - name: zomboid-config
          mountPath: /project-zomboid
          subPath: installation
  volumeClaimTemplates:
    - metadata:
        name: zomboid-config
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: csi-rbd-sc
        resources:
          requests:
            storage: 20Gi
