---
apiVersion: v1
kind: Service
metadata:
  name: factorio-udp
  annotations:
    metallb.universe.tf/allow-shared-ip: "shared-192.168.1.213"
spec:
  selector:
    app: factorio
  ports:
    - port: 34198
      protocol: UDP
      targetPort: 34198
  loadBalancerIP: 192.168.1.213
  type: LoadBalancer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: factorio-config-pvc
  namespace: default
spec:
  storageClassName: csi-rbd-sc
  accessModes:
   - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  #volumeName: factorio-config-pv
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: factorio
spec:
  selector:
    matchLabels:
      app: factorio
  serviceName: "factorio"
  replicas: 1
  template:
    metadata:
      labels:
        app: factorio # has to match .spec.selector.matchLabels
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
    
      nodeSelector:
        restriction_class: gameserver
    
      tolerations:
      - key: "restriction_class"
        operator: "Equal"
        value: "gameserver"
        effect: "NoSchedule"

      terminationGracePeriodSeconds: 30
      containers:
      - name: factorio
        image: factoriotools/factorio:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 34198
            protocol: UDP
        env:
        - name: LOAD_LATEST_SAVE
          value: "true"
        - name: DLC_SPACE_AGE
          value: "true"
        - name: PORT
          value: "34198"
        - name: UPDATE_MODS_ON_START
          value: "true"

        volumeMounts:
        - name: factorio-config
          mountPath: /factorio
      volumes:
      - name: factorio-config
        persistentVolumeClaim:
          claimName: factorio-config-pvc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mapshot
  labels:
    app: mapshot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mapshot
  template:
    metadata:
      labels:
        app: mapshot
    spec:
      # I'm scheduling this so that it ends up on the same node as the factorio game server. This is so that the RWO factorio PVC can (hopefully) mount on this pod as well. According to the docs, this requires that the pods be scheduled on the same node.
    
      nodeSelector:
        restriction_class: gameserver
    
      tolerations:
      - key: "restriction_class"
        operator: "Equal"
        value: "gameserver"
        effect: "NoSchedule"

      containers:
        - name: mapshot-renderer
          image: martydingo/mapshot:latest
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 6000m
              memory: 6G
          env:
            - name: FACTORIO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: factorio-credentials
                  key: username
            - name: FACTORIO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: factorio-credentials
                  key: token

            - name: MAPSHOT_SAVE_MODE
              value: "latest"

            - name: MAPSHOT_AREA
              value: "_player_"
            - name: MAPSHOT_JPEG_QUALITY
              value: "99"
            - name: MAPSHOT_MINIMUM_JPEG_QUALITY
              value: "97"
            - name: MAPSHOT_MINIMUM_TILES
              value: "64"
            - name: MAPSHOT_MODE
              value: "render"
            - name: MAPSHOT_SURFACES_TO_RENDER
              value: "_all_"
            - name: MAPSHOT_VERBOSE_MAPSHOT_LOG_LEVEL_INT
              value: "9"
            - name: MAPSHOT_INTERVAL
              # Every 10 hours
              value: "7200"
          volumeMounts:
            - mountPath: /opt/factorio
              name: mapshot-factorio
            - mountPath: /mapshot
              name: mapshot-config
        - name: mapshot-server
          image: martydingo/mapshot:latest
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 2000m
              memory: 6G
          env:
            - name: MAPSHOT_MODE
              value: "serve"
            - name: MAPSHOT_VERBOSE_MAPSHOT_LOG_LEVEL_INT
              value: "9"
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http
          volumeMounts:
            - mountPath: /mapshot
              name: mapshot-config
      volumes:
        - name: mapshot-factorio
          persistentVolumeClaim:
            readOnly: true
            claimName: factorio-config-pvc
  volumeClaimTemplates:
    - metadata:
        name: mapshot-config
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: csi-rbd-sc
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mapshot
  labels:
    app: mapshot
spec:
  ports:
  - port: 80
    targetPort: 8080
    name: mapshot
  selector:
    app: mapshot

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mapshot
  labels:
    app: mapshot
    gethomepage.dev/enabled: "true"
  annotations:
    #nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    gethomepage.dev/description: Factorio Mapshot renderer/server
    gethomepage.dev/group: Gameservers
    gethomepage.dev/icon: https://wiki.factorio.com/images/Iron_gear_wheel.png
    gethomepage.dev/name: Mapshot
    #gethomepage.dev/widget.type: "factorio"
    gethomepage.dev/widget.url: "https://factorio.perihelion.host"
    #gethomepage.dev/pod-selector: ""
    #gethomepage.dev/weight: 10 # optional
    #gethomepage.dev/instance: "public" # optional

spec:
  rules:
  - host: factorio.perihelion.host
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: mapshot
            port:
              number: 80
  tls:
  - hosts:
    - factorio.perihelion.host
    secretName: factorio.perihelion.host
