# authentik-values.yaml

authentik:
  #existingSecret:
  #  secretName: "authentik-secret-key"

  error_reporting:
    enabled: false

  postgresql:
    #host: postgres.domain.tld
    user: file:///postgres-creds/username
    password: file:///postgres-creds/password

server:
  volumes:
    - name: postgres-creds
      secret:
        secretName: authentik-postgresql
  volumeMounts:
    - name: postgres-creds
      mountPath: /postgres-creds
      readOnly: true
  ingress:
    enabled: true
    ingressClassName: nginx

    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"

    hosts:
      - auth.perihelion.host

    paths:
      - /

    pathType: Prefix

    tls:
      - secretName: auth-perihelion-host
        hosts:
          - auth.perihelion.host

  # nginx terminates HTTPS; connect to Authentik over HTTP internally.
  service:
    type: ClusterIP

worker:
  enabled: true
  volumes:
    - name: postgres-creds
      secret:
        secretName: authentik-postgresql
  volumeMounts:
    - name: postgres-creds
      mountPath: /postgres-creds
      readOnly: true

postgresql:
  enabled: true
  #auth:
  #  password: "REPLACE_WITH_RANDOM_DATABASE_PASSWORD"

