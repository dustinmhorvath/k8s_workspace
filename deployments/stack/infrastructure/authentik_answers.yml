# authentik-values.yaml

global:
  namespaceOverride: authentik
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-secret-key
          key: secret_key
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-postgresql
          key: password

authentik:
  secret_key: ""
  postgresql:
    password: ""

  error_reporting:
    enabled: false
#  email:
#    # -- SMTP Server emails are sent from, fully optional
#    host: ""
#    # -- SMTP server port
#    port: 587
#    # -- SMTP credentials, when left empty, no authentication will be done
#    username: ""
#    # -- SMTP credentials, when left empty, no authentication will be done
#    password: ""
#    # -- Use StartTLS. Enable either use_tls or use_ssl, they can't be enabled at the same time.
#    use_tls: false
#    # -- Use SSL. Enable either use_tls or use_ssl, they can't be enabled at the same time.
#    use_ssl: false
#    # -- Connection timeout
#    timeout: 30
#    # -- Email from address, can either be in the format "foo@bar.baz" or "authentik <foo@bar.baz>"
#    from: ""

server:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"

    pathType: Prefix
    paths:
      - /
    hosts:
      - auth.perihelion.host
    tls:
      - secretName: auth-perihelion-host
        hosts:
          - auth.perihelion.host

  # nginx terminates HTTPS; connect to Authentik over HTTP internally.
  service:
    type: ClusterIP

postgresql:
  enabled: true
  auth:
    existingSecret: authentik-postgresql
