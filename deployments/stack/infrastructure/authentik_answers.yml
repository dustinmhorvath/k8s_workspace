# authentik-values.yaml

global:
  namespaceOverride: authentik
  env:
    - name: AUTHENTIK_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: authentik-secret-key
          key: secret_key
    - name: AUTHENTIK_POSTGRESQL__PASSWORD
      valueFrom:
        secretKeyRef:
          name: authentik-postgresql
          key: password

authentik:
  secret_key: ""
  postgresql:
    password: ""

  error_reporting:
    enabled: false

server:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"

    pathType: Prefix
    paths:
      - /
    hosts:
      - auth.perihelion.host
    tls:
      - secretName: auth-perihelion-host
        hosts:
          - auth.perihelion.host

  # nginx terminates HTTPS; connect to Authentik over HTTP internally.
  service:
    type: ClusterIP

postgresql:
  enabled: true
  auth:
    existingSecret: authentik-postgresql
