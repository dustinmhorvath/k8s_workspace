---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openwebui
  namespace: argocd
spec:
  project: default
  sources:
  - chart: open-webui
    repoURL: https://open-webui.github.io/helm-charts
    targetRevision: 17.*
    helm:
      releaseName: openwebui
      valueFiles:
      - $openwebui_values/deployments/stack/applications/openwebui_answers.yml
  - repoURL: 'https://github.com/dustinmhorvath/k8s_workspace.git'
    targetRevision: main
    ref: openwebui_values

  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openwebui
  labels:
    app: openwebui
  annotations:
    #nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

spec:
  rules:
  - host: openwebui.perihelion.host
    http:
      paths:
      - pathType: Prefix
        path: /
        backend:
          service:
            name: openwebui-open-webui
            port:
              number: 80
  tls:
  - hosts:
    - openwebui.perihelion.host
    secretName: openwebui.perihelion.host
