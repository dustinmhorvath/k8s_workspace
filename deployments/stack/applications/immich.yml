---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
spec:
  # At the time of writing, immich is only compatible with pgvecto.rs <0.4. Latest postgres image with that version is 16.5.
  imageName: ghcr.io/tensorchord/cloudnative-pgvecto.rs:16.5-v0.3.0@sha256:be3f025d79aa1b747817f478e07e71be43236e14d00d8a9eb3914146245035ba
  instances: 1

  postgresql:
    shared_preload_libraries:
      - "vectors.so"

  managed:
    roles:
      - name: immich
        superuser: true
        login: true

  bootstrap:
    initdb:
      database: immich
      owner: immich
      #secret:
      #  name: immich-postgres-user
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS "vectors";
        - CREATE EXTENSION IF NOT EXISTS "cube" CASCADE;
        - CREATE EXTENSION IF NOT EXISTS "earthdistance" CASCADE;

  storage:
    size: 10Gi
    storageClass: csi-rbd-sc
---
#apiVersion: v1
#kind: PersistentVolume
#metadata:
#  name: immich-config-rbd
#spec:
#  capacity:
#    storage: 5Gi
#  accessModes:
#    - ReadWriteOnce
#  persistentVolumeReclaimPolicy: Retain
#  storageClassName: csi-rbd-sc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-config-rbd
  namespace: default
spec:
  storageClassName: csi-rbd-sc
  resources:
    requests:
      storage: 5Gi
  accessModes:
    - ReadWriteOnce
#  volumeName: immich-config-rbd
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  sources:
  - chart: immich
    repoURL: ghcr.io/immich-app/immich-charts
    targetRevision: 0.*
    helm:
      releaseName: immich
      valuesObject:
        env:
          DB_HOSTNAME: immich-postgres-rw.default.svc.cluster.local
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-postgres-app
                key: password
        #postgresql:
        #  global:
        #    postgresql:
        #      auth:
        #        existingSecret: immich-postgres-user
        immich:
          persistence:
            library:
              existingClaim: immich-config-rbd
        redis:
          enabled: true
          global:
            defaultStorageClass: csi-rbd-sc
        server:
          probes:
            startup:
              spec:
                failureThreshold: 360
          ingress: 
            main:
              annotations:
                cert-manager.io/cluster-issuer: "letsencrypt-prod"
              enabled: true
              hosts:
                - host: immich.perihelion.host
                  paths:
                    - path: /
              tls:
                - hosts:
                    - immich.perihelion.host
                  secretName: immich-perihelion-host
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default

